<header>
    <div class="logo-container">
        <img
            class="team-logo"
            src="{{ url_for('static', filename='images/logo.jpg') }}"
            alt="Team-logo"
        />
        <span class="logo-text">Egrasa</span>
    </div>
    <nav class="main-nav">
        <ul class="nav-list">
            <li>
                <a
                  href="{{ url_for('main.index') }}"
                  class="nav-link {{ 'active' if current_page == 'main.index' else '' }}"
                >
                  Головна
                </a>
            </li>
            <li>
                <a
                  href="{{ url_for('content.news_feed') }}"
                  class="nav-link {{ 'active' if current_page == 'content.news_feed' else '' }}"
                >
                  Новини
                </a>
            </li>
            <li>
                <a
                  href="{{ url_for('main.about') }}"
                  class="nav-link {{ 'active' if current_page == 'main.about' else '' }}"
                >
                  Про нас
                </a>
            </li>
            <li>
                <a
                  href="{{ url_for('main.contacts') }}"
                  class="nav-link {{ 'active' if current_page == 'main.contacts' else '' }}"
                >
                  Контакти
                </a>
            </li>
            {% if current_user.is_authenticated %}
            <li>
                <a
                href="#"
                class="nav-link {{ 'active' if current_page == 'content.index' else '' }}"
                >
                Блог
                </a>
            </li>
            <li>
                <a
                href="#"
                class="nav-link {{ 'active' if current_page == 'user.profile' else '' }}"
                >
                Профіль
                </a>
            </li>
            {% endif %}
        </ul>
    </nav>
    <div class="header-actions">
        {% if current_user.is_authenticated %}
        <div class="user-menu">
            <button class="user-avatar" aria-expanded="false" aria-controls="user-dropdown">
                <img src="{{ current_user.avatar or url_for('static', filename='images/default-avatar.jpg') }}" alt="User Avatar">
            </button>
            <ul class="dropdown-menu" id="user-dropdown">
                <li><a href="{{ url_for('user.settings') }}"><i class="fas fa-cog"></i> Settings</a></li>
                <li><a href="{{ url_for('user.profile') }}"><i class="fas fa-user"></i> My Profile</a></li>
                <li><a href="{{ url_for('content.index') }}"><i class="fas fa-newspaper"></i> My Posts</a></li>
                <li><a href="{{ url_for('auth.signout') }}"><i class="fas fa-sign-out-alt"></i> Log Out</a></li>
            </ul>
        </div>
        {% else %}
        <div class="auth-buttons">
            <a href="{{ url_for('auth.login') }}" class="auth-btn login-btn">
                Увійти
            </a>
            <a href="{{ url_for('auth.register') }}" class="auth-btn register-btn">
                Зареєструватися
            </a>
        </div>
        {% endif %}
    </div>
</header>
